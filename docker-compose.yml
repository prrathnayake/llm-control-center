services:
  llm-control-center:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # Optional local LLM provider. Uncomment if you want the gateway to route to Ollama.
  # ollama:
  #   image: ollama/ollama:latest
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama:/root/.ollama
  #   restart: unless-stopped

  # Optional PostgreSQL database. Uncomment to use PostgreSQL instead of SQLite.
  # Set LLM_CC_DATABASE_URL=postgresql+psycopg2://llm_cc:changeme@postgres:5432/llm_control_center in .env
  # postgres:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_DB: llm_control_center
  #     POSTGRES_USER: llm_cc
  #     POSTGRES_PASSWORD: changeme
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   restart: unless-stopped

