# Production overrides — merge with docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  llm-control-center:
    environment:
      - LLM_CC_ENV=production
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  postgres:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Ollama is disabled in production. To enable, also provide ollama.prod.yml.
  # ollama:
  #   profiles:
  #     - disabled
