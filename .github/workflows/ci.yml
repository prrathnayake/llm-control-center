name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Lint
        run: ruff check src tests

      - name: Test
        env:
          LLM_CC_ADMIN_TOKEN: test-admin-token
          LLM_CC_API_KEY_PEPPER: test-pepper
          LLM_CC_DATABASE_URL: sqlite:///./ci-control-center.sqlite3
        run: pytest

      - name: Import smoke test
        run: python -c "from llm_control_center.app import create_app; create_app(); print('ok')"
